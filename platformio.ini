; PlatformIO Project Configuration File
;
; Scale_64_Garage - 1:64 scale multi-storey (stack) parking garage model
; Target : ESP32-S3 DevKit + custom PCB
; Framework: ESP-IDF (Arduino is intentionally NOT used)
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Please visit https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
; resolved to espressif32 7.0.1 / ESP-IDF v6.0.1 on this machine
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
